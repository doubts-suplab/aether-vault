global:
  imageRegistry: "ghcr.io/suplab"
  imagePullPolicy: Always
  nameOverride: ""
  namespaceOverride: "aether-vault"

openshift:
  enabled: false

route:
  host: "vault.aether.apps.cluster.example.com"
  termination: edge
  insecureEdgeTerminationPolicy: Redirect

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  host: vault.aether.local
  path: /
  tls: []

serviceMonitor:
  enabled: false
  namespace: monitoring
  interval: 30s

# ─── vault-api (Knowledge Platform, port 8084) ────────────────────────────────
app:
  image:
    repository: "ghcr.io/suplab/vault-api"
    tag: "0.1.0-SNAPSHOT"

  replicaCount: 2

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  autoscaling:
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

  serviceAccount:
    create: true
    annotations: {}

  # ConfigMap values — non-sensitive runtime configuration.
  config:
    # Ollama embedding runtime — blank base-url keeps Vault standalone (embedding may be disabled).
    ollamaBaseUrl: "http://ollama:11434"
    embeddingEnabled: "true"
    embeddingModel: "all-minilm"
    tokenizer: "bpe"
    # Freshness sweep + auto-reingestion (auto-reingest is a no-op unless a source connector is enabled).
    freshnessEnabled: "true"
    freshnessCron: "0 0 4 * * *"
    reindexIntervalDays: "30"
    reingestCron: "0 30 4 * * *"
    # Source connectors — off by default; enable per-scheme when an operator opens a source to Vault.
    sourceEnabled: "true"
    graphExtractionEnabled: "true"
    graphExtractor: "heuristic"
    springProfilesActive: "k8s"

  # Name of a pre-existing Secret (External Secrets Operator or kubectl).
  # Expected keys: postgres-url, postgres-user, postgres-password.
  secrets:
    existingSecret: "aether-vault-secrets"
