apiVersion: v1
kind: Service
metadata:
  name: aether-vault
  namespace: {{ include "aether-vault.namespace" . }}
  labels:
    {{- include "aether-vault.labels" . | nindent 4 }}
    app.kubernetes.io/component: knowledge-engine
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aether-vault
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8084
      targetPort: 8084
      protocol: TCP
