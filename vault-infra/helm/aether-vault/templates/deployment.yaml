apiVersion: apps/v1
kind: Deployment
metadata:
  name: aether-vault
  namespace: {{ include "aether-vault.namespace" . }}
  labels:
    {{- include "aether-vault.labels" . | nindent 4 }}
    app.kubernetes.io/component: knowledge-engine
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: aether-vault
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aether-vault
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
        app.kubernetes.io/part-of: aether-vault
        app.kubernetes.io/component: knowledge-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8084"
        prometheus.io/path: "/actuator/prometheus"
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "aether-vault.app.serviceAccountName" . }}
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        {{- if not .Values.openshift.enabled }}
        runAsUser: 1000
        fsGroup: 1000
        {{- end }}

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: aether-vault
              app.kubernetes.io/instance: {{ .Release.Name }}

      containers:
        - name: aether-vault
          image: {{ include "aether-vault.app.image" . }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8084
              protocol: TCP

          securityContext:
            runAsNonRoot: true
            {{- if not .Values.openshift.enabled }}
            runAsUser: 1000
            {{- end }}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}

          env:
            # ── Secrets ───────────────────────────────────────────────────────
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.secrets.existingSecret }}
                  key: postgres-url
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.secrets.existingSecret }}
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.secrets.existingSecret }}
                  key: postgres-password
            # ── ConfigMap ─────────────────────────────────────────────────────
            - name: OLLAMA_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: aether-vault-config
                  key: ollama-base-url
            - name: EMBEDDING_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: aether-vault-config
                  key: embedding-enabled
            - name: EMBEDDING_MODEL
              valueFrom:
                configMapKeyRef:
                  name: aether-vault-config
                  key: embedding-model
            - name: VAULT_TOKENIZER
              valueFrom:
                configMapKeyRef:
                  name: aether-vault-config
                  key: tokenizer
            - name: VAULT_FRESHNESS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: aether-vault-config
                  key: freshness-enabled
            - name: VAULT_FRESHNESS_CRON
              valueFrom:
                configMapKeyRef:
                  name: aether-vault-config
                  key: freshness-cron
            - name: VAULT_REINDEX_INTERVAL_DAYS
              valueFrom:
                configMapKeyRef:
                  name: aether-vault-config
                  key: reindex-interval-days
            - name: VAULT_REINGEST_CRON
              valueFrom:
                configMapKeyRef:
                  name: aether-vault-config
                  key: reingest-cron
            - name: VAULT_SOURCE_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: aether-vault-config
                  key: source-enabled
            - name: VAULT_GRAPH_EXTRACTION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: aether-vault-config
                  key: graph-extraction-enabled
            - name: VAULT_GRAPH_EXTRACTOR
              valueFrom:
                configMapKeyRef:
                  name: aether-vault-config
                  key: graph-extractor
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: aether-vault-config
                  key: spring-profiles-active

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}
