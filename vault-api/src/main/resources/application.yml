spring:
  application:
    name: aether-vault
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/aether_vault}
    username: ${POSTGRES_USER:aether}
    password: ${POSTGRES_PASSWORD:aether}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

aether:
  vault:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    embedding:
      enabled: ${EMBEDDING_ENABLED:true}
      model: ${EMBEDDING_MODEL:all-minilm}
    ingestion:
      chunk-size: ${VAULT_CHUNK_SIZE:1000}
      chunk-overlap: ${VAULT_CHUNK_OVERLAP:150}
    # Chunk token counting: 'bpe' (real tokenizer, default) or 'heuristic' (dependency-free estimate).
    tokenizer: ${VAULT_TOKENIZER:bpe}
    source:
      enabled: ${VAULT_SOURCE_ENABLED:true}
      http:
        enabled: ${VAULT_SOURCE_HTTP_ENABLED:true}
        timeout-seconds: ${VAULT_SOURCE_HTTP_TIMEOUT_SECONDS:15}
        max-bytes: ${VAULT_SOURCE_HTTP_MAX_BYTES:8388608}
      filesystem:
        # Off by default. Enable only when an operator opens a directory tree to Vault, and set
        # allowed-root to that absolute path — file: sources are confined to it.
        enabled: ${VAULT_SOURCE_FS_ENABLED:false}
        allowed-root: ${VAULT_SOURCE_FS_ALLOWED_ROOT:}
        max-bytes: ${VAULT_SOURCE_FS_MAX_BYTES:8388608}
      s3:
        # Off by default. Enable to ingest s3://bucket/key sources. Credentials come from the
        # standard AWS provider chain; endpoint override supports S3-compatible stores (e.g. MinIO).
        enabled: ${VAULT_SOURCE_S3_ENABLED:false}
        region: ${VAULT_SOURCE_S3_REGION:us-east-1}
        endpoint: ${VAULT_SOURCE_S3_ENDPOINT:}
        max-bytes: ${VAULT_SOURCE_S3_MAX_BYTES:8388608}
    freshness:
      enabled: ${VAULT_FRESHNESS_ENABLED:true}
      reindex-interval-days: ${VAULT_REINDEX_INTERVAL_DAYS:30}
      cron: ${VAULT_FRESHNESS_CRON:0 0 4 * * *}
    graph:
      extraction:
        enabled: ${VAULT_GRAPH_EXTRACTION_ENABLED:true}
      # NER strategy: 'heuristic' (dependency-free default) or 'llm' (Ollama, falls back to heuristic).
      extractor: ${VAULT_GRAPH_EXTRACTOR:heuristic}
      llm-model: ${VAULT_GRAPH_LLM_MODEL:llama3}
      # Canonicalise + de-duplicate surface-form variants of the same entity (applied at ingest + query).
      resolve-entities: ${VAULT_GRAPH_RESOLVE_ENTITIES:true}
      max-entities-per-chunk: ${VAULT_GRAPH_MAX_ENTITIES_PER_CHUNK:32}
      max-entities-for-relations: ${VAULT_GRAPH_MAX_ENTITIES_FOR_RELATIONS:8}
