# EEIK Project Manifest — Aether Vault
# Generated from eeik-bootstrap manifest-template.yaml
# Repo: suplab/aether-vault

project:
  name: aether-vault
  description: >
    Organisational knowledge platform for the Aether ecosystem. Ingests documents, chunks and
    embeds them, serves semantic vector search and a Retrieval-Augmented Generation pipeline,
    builds a per-collection knowledge graph of entities and relations, and keeps indexed
    knowledge fresh via a scheduled re-index sweep.
  owning_team: suplab
  business_domain: generic
  project_type: knowledge-platform

technology:
  backend:
    language: java
    version: "21"
    framework: spring-boot
    framework_version: "3.3.x"
  database:
    type: postgresql
    version: "16"
    migration_tool: flyway
    orm: spring-data-jdbc
    extensions:
      - pgvector
  vector_store:
    primary: pgvector
  llm:
    runtime: ollama
    embedding_model: all-MiniLM-L6-v2
    embedding_dimensions: 384

architecture:
  style: modular-monolith
  runnable_applications:
    - name: vault-api
      role: platform-api
      port: 8084
  design_patterns:
    - hexagonal-architecture
    - domain-driven-design
    - retrieval-augmented-generation
    - privacy-by-design
  api_style: rest

capabilities:
  owns:
    - knowledge
  detail:
    - document-indexing
    - vector-search
    - knowledge-graph
    - rag-pipeline
    - knowledge-freshness

memory:
  memory_pattern: vector-store
  scope_key: tenant-and-collection

governance:
  profile: enterprise
  multi_tenancy: tenant-and-collection-scoped
  compliance:
    - GDPR

observability:
  logging: slf4j-structured
  metrics: micrometer-prometheus

delivery:
  team_structure: solo
  methodology: incremental
  cicd_platform: github-actions
  branch_strategy: feature-branches
  commit_convention: conventional-commits

ecosystem:
  layer: platform
  consumes: []
  consumed_by:
    - aether-grid
    - aether-flow
    - aether-enterprise
  sibling_repositories:
    - suplab/aether
    - suplab/aether-core
    - suplab/aether-grid
    - suplab/aether-memory

bootstrap:
  source: eeik-bootstrap
  source_repo: suplab/eeik-bootstrap
  capability_packs_activated:
    - java
    - ai-engineering
    - architecture
    - governance
